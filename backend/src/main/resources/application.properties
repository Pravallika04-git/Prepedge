# Server
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/placement_portal?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=PlacementPortalSuperSecretKeyThatIsLongEnoughForHS512Algorithm2024!@#$%^&*()
app.jwt.expiration-ms=86400000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# AI Service Configuration
app.ai.provider=${AI_PROVIDER:gemini}
app.ai.api-key=${GEMINI_API_KEY:${AI_API_KEY:}}
app.ai.api-url=${AI_API_URL:}
app.ai.model=${AI_MODEL:gemini-3.5-flash}

# Code Execution (Judge0)
app.judge0.api-url=${JUDGE0_API_URL:https://judge0-ce.p.rapidapi.com}
app.judge0.api-key=${JUDGE0_API_KEY:placeholder}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://prepedge-3y4d.vercel.app}

# Logging
logging.level.com.placementportal=DEBUG
logging.level.org.springframework.security=INFO
